[package]
name = "labyrinth"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Labyrinth 1.1 encrypted message-history storage (Catbird profile) for MLS chat on atproto"
repository = "https://github.com/joshlacal/labyrinth"

[dependencies]
aes = "0.9.3"
aes-gcm = "0.11.1"
chacha20 = { version = "0.10.2", features = ["xchacha"] }
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
curve25519-dalek = { version = "5.0.0", features = ["rand_core", "digest"] }
ed25519-dalek = "3.0.0"
ml-kem = { version = "0.3.3", features = ["zeroize", "hazmat"] }
rand_core = "0.10.1"
getrandom = "0.4.3"
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
hex = "0.4.3"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
serde_json = { version = "1.0.154", optional = true }
serde_ipld_dagcbor = { version = "0.7.0", optional = true }
cid = { version = "0.11.3", optional = true }

[features]
# Store implementations over mls-ds `blue.catbird.labyrinth.*` XRPC
# endpoints (docs/MLSDS_BACKEND.md), plus a memory-backed reference server.
xrpc = ["dep:serde_json"]
# The personal mailbox in an atproto Space over `com.atproto.space.*`
# (SPEC §9), plus a memory-backed reference PDS for those endpoints.
space = ["xrpc", "dep:serde_ipld_dagcbor", "dep:cid"]

[dev-dependencies]
hex-literal = "1.1.0"
serde_json = "1.0.154"
proptest = "1.12.0"
xeddsa = "1.1.0"
rand = "0.10.3"
ureq = { version = "3.5.0", default-features = false }
