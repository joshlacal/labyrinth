[workspace]
members = [".", "labyrinth-protocol"]
resolver = "2"

[package]
name = "labyrinth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Labyrinth 1.1 encrypted message-history storage (Catbird clean-slate PQ Spaces profile) for MLS chat on atproto"
repository = "https://github.com/joshlacal/labyrinth"

[dependencies]
labyrinth-protocol = { path = "labyrinth-protocol" }
atproto-spaces = { path = "../catbird-atproto/atproto-spaces", default-features = false }
async-trait = "0.1"
web-time = "1.1"
aes = "0.9"
aes-gcm = "0.11"
chacha20 = { version = "0.10", features = ["xchacha"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
curve25519-dalek = { version = "5", features = ["rand_core", "digest"] }
ed25519-dalek = "3"
ml-kem = { version = "0.3", features = ["zeroize", "hazmat"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = "0.10"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
hex = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ipld_dagcbor = "0.6"
cid = "0.11"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
default = ["space"]
# Retained as an unconditional no-op alias for downstream feature flags;
# Spaces-only storage is always enabled in clean-slate Labyrinth.
space = []
sim = []
plant_p16 = ["sim"]

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
hex-literal = "1.1"
serde_json = "1"
proptest = "1.11"
xeddsa = "1.1"
rand = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ureq = { version = "3", default-features = false }
