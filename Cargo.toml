[package]
name = "labyrinth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Labyrinth 1.1 encrypted message-history storage (Catbird profile) for MLS chat on atproto"
repository = "https://github.com/joshlacal/labyrinth"

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
chacha20 = { version = "0.10", features = ["xchacha"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
curve25519-dalek = { version = "5", features = ["rand_core", "digest"] }
ed25519-dalek = "3"
ml-kem = { version = "0.3", features = ["zeroize", "hazmat"] }
rand_core = "0.10"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
hex = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = { version = "1", optional = true }

[features]
# Store implementations over mls-ds `blue.catbird.labyrinth.*` XRPC
# endpoints (docs/MLSDS_BACKEND.md), plus a memory-backed reference server.
xrpc = ["dep:serde_json"]
# The personal mailbox in an atproto Space over `com.atproto.space.*`
# (SPEC §9), plus a memory-backed reference PDS for those endpoints.
space = ["xrpc"]

[dev-dependencies]
hex-literal = "1.1"
serde_json = "1"
proptest = "1.11"
xeddsa = "1.1"
rand = "0.10"
ureq = { version = "3", default-features = false }
