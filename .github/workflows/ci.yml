name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cargo.toml takes atproto-spaces from the sibling catbird-atproto
      # checkout (../catbird-atproto), so CI fetches that public repo at a
      # pinned commit next to this one.
      - name: Check out sibling catbird-atproto
        run: |
          git init -q ../catbird-atproto
          git -C ../catbird-atproto fetch -q --depth 1 https://github.com/joshlacal/catbird-atproto 4299c438ff92d13cd554cdf686ca74156c987f84
          git -C ../catbird-atproto checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo test --release --all-features
