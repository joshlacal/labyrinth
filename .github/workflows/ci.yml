name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Petrel and the Spaces compatibility crate
        run: |
          git init -q ../Petrel
          git -C ../Petrel fetch -q --depth 1 https://github.com/joshlacal/Petrel 76bf7c8beb83fbb861183d04948fa5a061698772
          git -C ../Petrel checkout -q FETCH_HEAD
          git init -q ../catbird-atproto
          git -C ../catbird-atproto fetch -q --depth 1 https://github.com/joshlacal/catbird-atproto aed64f2c6decd58696f482b9d024dafc407d3aa2
          git -C ../catbird-atproto checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo test --release --all-features
