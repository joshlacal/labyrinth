name: Docs

# Builds the Labyrinth book (docs/book, mdBook) and the rustdoc API reference,
# and publishes them together with GitHub Pages at
# https://joshlacal.github.io/labyrinth/ (the API under /api/).
#
# Pull requests build the site to catch broken pages but never deploy, so
# nothing from a fork can publish. Deploys run only for pushes to main and by
# hand.
#
# Needs Settings > Pages > Build and deployment > Source set to "GitHub
# Actions".

'on':
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'labyrinth-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.4.52

jobs:
  build-site:
    name: Build book and API reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Cargo.toml takes atproto-spaces from the sibling catbird-atproto
      # checkout, pinned to the same commit as ci.yml.
      - name: Check out sibling catbird-atproto
        run: |
          git init -q ../catbird-atproto
          git -C ../catbird-atproto fetch -q --depth 1 https://github.com/joshlacal/catbird-atproto e3356fd4f3349de1d647e3558964d08449c03b13
          git -C ../catbird-atproto checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build docs/book
      - name: Build the API reference
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo doc --no-deps --locked -p labyrinth -p labyrinth-protocol
      - name: Assemble the site
        run: |
          set -euo pipefail
          site=target/book
          test -f "$site/index.html"
          rm -rf "$site/api"
          cp -R target/doc "$site/api"
          test -f "$site/api/labyrinth/index.html"
          test -f "$site/api/labyrinth_protocol/index.html"
          # rustdoc has no page at its root; send it to the crate.
          cat > "$site/api/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Labyrinth API reference</title>
          <link rel="canonical" href="labyrinth/">
          <meta http-equiv="refresh" content="0; url=labyrinth/">
          </head>
          <body>
          <p><a href="labyrinth/">Labyrinth API reference</a></p>
          </body>
          </html>
          HTML
          touch "$site/.nojekyll"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
